# >>> AGY-WORKSTATION COLAB SSH BRIDGE >>>
# Google Colab CLI SSH bridge (supports ssh / VS Code / Antigravity Remote-SSH)
Host colab
    ProxyCommand ~/.local/bin/colab ssh --proxy-mode
    User root
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null

Host colab-t4
    ProxyCommand ~/.local/bin/colab ssh --proxy-mode -s t4 --gpu T4
    User root
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
# <<< AGY-WORKSTATION COLAB SSH BRIDGE <<<
